<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CompanyRadar</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>

<body>

  <div class="auth-container">

    <div class="auth-brand">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="0" y="10" width="4" height="8" fill="currentColor" opacity="0.4" />
          <rect x="7" y="5" width="4" height="13" fill="currentColor" opacity="0.7" />
          <rect x="14" y="0" width="4" height="18" fill="currentColor" />
        </svg>
      </div>
      <span class="logo-text">CompanyRadar</span>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to your account to continue</p>

      <div id="error" class="error hidden"></div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. debanshu99" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>

      <button id="loginBtn" onclick="login()">
        Log in
      </button>

      <p class="auth-switch">
        Don't have an account? <a href="/signup.html">Sign up</a>
      </p>
    </div>

  </div>
  <div class="creator-badge">
    Made by: Debanshu Brahma
  </div>

  <script>
    // If already logged in, redirect to dashboard
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('error');

      if (!username || !password) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';
      errorEl.classList.add('hidden');

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error);

        // Save token and user info
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Redirect to dashboard
        window.location.href = '/';

      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    }

    // Allow Enter key
    document.addEventListener('DOMContentLoaded', () => {
      document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
      });
    });
  </script>

</body>

</html>
